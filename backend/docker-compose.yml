# ─────────────────────────────────────────────────────────────────────────────
# HelioVision – Minimal Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Single-service deployment: just the FastAPI backend.
# No PostgreSQL. No Redis. No Nginx.
#
# Usage:
#   docker compose up -d              # start
#   docker compose logs -f            # tail logs
#   docker compose down               # stop
#
# The full stack (with postgres + redis + nginx) is in docker-compose.full.yml
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: heliovision-backend:latest
    container_name: heliovision_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - WORKERS=2
      # No DATABASE_URL — running in stateless mode
      # No REDIS_URL — using in-memory rate limiting
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - ALLOWED_ORIGINS_STR=${ALLOWED_ORIGINS_STR:-http://localhost:3000}
      - SOLAR_FORECAST_MODEL_PATH=/models/solar_forecast_model.pkl
      - SAVINGS_MODEL_PATH=/models/savings_prediction_model.pkl
      - YOLO_MODEL_PATH=/models/prediction_yolo1.pt
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
      - ../trained-models:/models:ro   # mount trained model files read-only
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  uploads_data:
    driver: local
  logs_data:
    driver: local
